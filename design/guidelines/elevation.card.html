<!-- @dsCard group="Foundations" viewport="700x180" name="Elevation" subtitle="Borders carry structure; shadow appears only on hover and overlays" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:var(--sp-6) var(--sp-7);font:var(--type-body)}.row{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}.lab{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}.sw{display:flex;flex-direction:column;gap:var(--sp-2)}.chip{width:64px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}body{background:var(--surface-page)}.e{width:130px;height:78px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:var(--radius-card)}</style></head><body>
<div class="row" style="gap:var(--sp-6)">
<div class="sw"><div class="e" style="box-shadow:var(--shadow-none)"></div><span class="lab">shadow-none · rest</span></div><div class="sw"><div class="e" style="box-shadow:var(--shadow-sm)"></div><span class="lab">shadow-sm · row hover</span></div><div class="sw"><div class="e" style="box-shadow:var(--shadow-md)"></div><span class="lab">shadow-md · card hover</span></div><div class="sw"><div class="e" style="box-shadow:var(--shadow-lift)"></div><span class="lab">shadow-lift · overlay</span></div>
</div></body></html>
