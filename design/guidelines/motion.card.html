<!-- @dsCard group="Foundations" viewport="700x150" name="Motion" subtitle="120–280ms, one easing curve, no bounce and nothing decorative" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:var(--sp-6) var(--sp-7);font:var(--type-body)}.row{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}.lab{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}.sw{display:flex;flex-direction:column;gap:var(--sp-2)}.chip{width:64px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}.t{font:var(--type-sm);color:var(--text-body)}.k{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}</style></head><body>
<div style="display:grid;grid-template-columns:auto 1fr;gap:var(--sp-3) var(--sp-6);align-items:baseline">
<span class="k">--dur-1 120ms</span><span class="t">Control colour: hover, press, border on focus</span>
<span class="k">--dur-2 180ms</span><span class="t">Surfaces: card hover, availability badge swap</span>
<span class="k">--dur-3 280ms</span><span class="t">Entering content: a saved confirmation, a revealed step</span>
<span class="k">--ease-standard</span><span class="t">cubic-bezier(.2,.6,.2,1) — the default for everything above</span>
</div></body></html>
