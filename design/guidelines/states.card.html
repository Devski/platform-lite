<!-- @dsCard group="Foundations" viewport="700x180" name="Hover, press, focus" subtitle="Solid darkens, quiet fills grey, focus is a 2px ink ring at 2px offset" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:var(--sp-6) var(--sp-7);font:var(--type-body)}.row{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}.lab{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}.sw{display:flex;flex-direction:column;gap:var(--sp-2)}.chip{width:64px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}.btn{display:inline-flex;align-items:center;height:var(--control-h);padding:0 var(--control-pad-x);border-radius:var(--radius-control);font:var(--type-sm);font-weight:var(--fw-semibold);border:1px solid transparent}</style></head><body>
<div class="row" style="gap:var(--sp-5)">
<div class="sw"><span class="btn" style="background:var(--action-solid);color:var(--action-solid-text)">Sign up</span><span class="lab">rest · n-950</span></div>
<div class="sw"><span class="btn" style="background:var(--action-solid-hover);color:var(--action-solid-text)">Sign up</span><span class="lab">hover · n-800</span></div>
<div class="sw"><span class="btn" style="background:var(--action-solid);color:var(--action-solid-text);outline:2px solid var(--focus-ring);outline-offset:2px">Sign up</span><span class="lab">focus-visible</span></div>
<div class="sw"><span class="btn" style="background:var(--surface-card);border-color:var(--action-quiet-border);color:var(--text-strong)">Log in</span><span class="lab">quiet rest</span></div>
<div class="sw"><span class="btn" style="background:var(--action-quiet-hover);border-color:var(--border-strong);color:var(--text-strong)">Log in</span><span class="lab">quiet hover</span></div>
<div class="sw"><span class="btn" style="background:var(--action-solid);color:var(--action-solid-text);opacity:.45">Sign up</span><span class="lab">disabled · .45</span></div>
</div></body></html>
