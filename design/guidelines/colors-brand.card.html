<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:var(--sp-6) var(--sp-7);font:var(--type-body)}.row{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}.lab{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}.sw{display:flex;flex-direction:column;gap:var(--sp-2)}.chip{width:64px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--plaque-navy)"></div><span class="lab">plaque-navy<br>#1b4c9c</span></div><div class="sw"><div class="chip" style="background:var(--plaque-navy-deep)"></div><span class="lab">plaque-navy-deep<br>#143a78</span></div><div class="sw"><div class="chip" style="background:var(--plaque-red)"></div><span class="lab">plaque-red<br>#cf3a2f</span></div><div class="sw"><div class="chip" style="background:var(--plaque-hairline)"></div><span class="lab">plaque-hairline<br>#8fd4e6</span></div><div class="sw"><div class="chip" style="background:var(--plaque-ink)"></div><span class="lab">plaque-ink<br>#ffffff</span></div></div></body></html>
