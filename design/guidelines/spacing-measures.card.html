<div style="display:flex;flex-direction:column;gap:var(--sp-3)">
<div><div class="m" style="width:min(100%,var(--measure-form))"></div><span class="lab">28rem — auth, onboarding, settings column</span></div><div><div class="m" style="width:min(100%,var(--measure-prose))"></div><span class="lab">40rem — legal and help text</span></div><div><div class="m" style="width:min(100%,var(--measure-page))"></div><span class="lab">68rem — public profile</span></div><div><div class="m" style="width:min(100%,var(--measure-wide))"></div><span class="lab">78rem — top bar and footer</span></div>
</div></body></html>
