<!-- @dsCard group="Colors" viewport="700x160" name="State colours" subtitle="Desaturated so they sit inside a grey interface" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:var(--sp-6) var(--sp-7);font:var(--type-body)}.row{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}.lab{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}.sw{display:flex;flex-direction:column;gap:var(--sp-2)}.chip{width:64px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}.pair{display:flex;flex-direction:column;gap:var(--sp-3)}.msg{display:inline-block;padding:var(--sp-3) var(--sp-4);border-radius:var(--radius-sm);font:var(--type-sm)}</style></head><body>
<div class="row" style="gap:var(--sp-5)">
<div class="pair"><span class="msg" style="background:var(--state-success-bg);color:var(--state-success)">Address saved.</span><span class="lab">state-success · #1f6f4a</span></div>
<div class="pair"><span class="msg" style="background:var(--state-danger-bg);color:var(--state-danger)">Invalid e-mail or password.</span><span class="lab">state-danger · #a83232</span></div>
<div class="pair"><span class="msg" style="background:var(--state-warning-bg);color:var(--state-warning)">Reserved — pick another.</span><span class="lab">state-warning · #8a5a00</span></div>
</div></body></html>
