<!-- @dsCard group="Colors" viewport="700x170" name="Semantic aliases" subtitle="What components actually reference — surfaces, text, borders, action" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:var(--surface-card);padding:var(--sp-6) var(--sp-7);font:var(--type-body)}.row{display:flex;gap:var(--sp-4);align-items:flex-end;flex-wrap:wrap}.lab{font:var(--type-mono);font-size:var(--fs-micro);color:var(--text-subtle)}.sw{display:flex;flex-direction:column;gap:var(--sp-2)}.chip{width:64px;height:52px;border-radius:var(--radius-sm);border:1px solid var(--border-hairline)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-4)}.cell{display:flex;align-items:center;gap:var(--sp-3);font:var(--type-sm)}.dot{width:28px;height:28px;border-radius:var(--radius-xs);border:1px solid var(--border-hairline);flex:none}</style></head><body>
<div class="grid">
<div class="cell"><span class="dot" style="background:var(--surface-page)"></span><span class="lab">surface-page</span></div>
<div class="cell"><span class="dot" style="background:var(--surface-card)"></span><span class="lab">surface-card</span></div>
<div class="cell"><span class="dot" style="background:var(--surface-sunken)"></span><span class="lab">surface-sunken</span></div>
<div class="cell"><span class="dot" style="background:var(--surface-inverse)"></span><span class="lab">surface-inverse</span></div>
<div class="cell"><span class="dot" style="background:var(--text-strong)"></span><span class="lab">text-strong</span></div>
<div class="cell"><span class="dot" style="background:var(--text-body)"></span><span class="lab">text-body</span></div>
<div class="cell"><span class="dot" style="background:var(--text-muted)"></span><span class="lab">text-muted</span></div>
<div class="cell"><span class="dot" style="background:var(--text-subtle)"></span><span class="lab">text-subtle</span></div>
<div class="cell"><span class="dot" style="background:var(--border-hairline)"></span><span class="lab">border-hairline</span></div>
<div class="cell"><span class="dot" style="background:var(--border-default)"></span><span class="lab">border-default</span></div>
<div class="cell"><span class="dot" style="background:var(--border-strong)"></span><span class="lab">border-strong</span></div>
<div class="cell"><span class="dot" style="background:var(--action-solid)"></span><span class="lab">action-solid</span></div>
</div></body></html>
