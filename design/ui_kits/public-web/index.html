<!-- @dsCard group="Public web" viewport="1280x860" name="Public web — profile as a wall of work, work landing, hero, 404" subtitle="Cover under a transparent bar, slide-in about panel, full-width works, the work's own page (#200); visitor · other · owner; desktop · phone" -->
<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><title>Architektów 3d — public web</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page)}#root{min-height:100vh}
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--sp-6);z-index:200;display:flex;gap:2px;padding:4px;background:var(--surface-inverse);border-radius:var(--radius-full);box-shadow:var(--shadow-lift)}
.switcher button{appearance:none;border:0;cursor:pointer;background:transparent;color:rgba(255,255,255,.7);font-family:var(--font-sans);font-size:13px;font-weight:600;padding:6px 14px;border-radius:var(--radius-full)}
.switcher button[aria-pressed="true"]{background:#fff;color:var(--n-950)}
.phone-stage{min-height:100vh;display:grid;place-items:center;background:var(--n-200);padding:var(--sp-8)}
.phone{width:390px;height:844px;border-radius:44px;background:#000;padding:10px;box-shadow:var(--shadow-lift)}
.phone-screen{width:100%;height:100%;border-radius:36px;overflow:hidden;position:relative;transform:translateZ(0);background:var(--surface-page)}
.phone-scroll{position:absolute;inset:0;overflow:auto}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="data.js"></script></head>
<body><div id="root"></div>
<script type="text/babel" src="../app/tweaks-panel.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="PublicProfile.jsx"></script>
<script type="text/babel" src="WorkPage.jsx"></script>
<script type="text/babel" src="NotFound.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "viewer": "owner",
  "screen": "phone",
  "locale": "pl",
  "hasCover": true,
  "hasPhoto": true,
  "aboutOpen": true
}/*EDITMODE-END*/;
const VIEWER_LABEL = { visitor: "Wylogowany", other: "Zalogowany (cudzy)", owner: "Właściciel" };
const VIEWER_VALUE = Object.fromEntries(Object.entries(VIEWER_LABEL).map(([k,v])=>[v,k]));
function Site(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [screen,setScreen]=React.useState("profile");
  const [workId,setWorkId]=React.useState(null);
  const [editWork,setEditWork]=React.useState(false);
  const [lightbox,setLightbox]=React.useState(null);
  const [profile,setProfile]=React.useState(window.A3D_DATA.profile);
  const [works,setWorks]=React.useState(window.A3D_DATA.works);
  const rootRef=React.useRef(null);
  const phone=t.screen==="phone";
  const scrollTop=()=>{ (rootRef.current||window).scrollTo(0,0); };
  const go=(s)=>{ setScreen(s==="register"||s==="login"?"hero":s); scrollTop(); };
  const p={...profile, cover:t.hasCover?window.A3D_DATA.profile.cover:null, avatarUrl:t.hasPhoto?window.A3D_DATA.profile.avatarUrl:null};
  const NEW_WORK={id:"new",isNew:true,slug:"nowa-realizacja",name:"",investor:"",developer:"",description:"",cover:null,thumbs:[],pictures:[],orbit:null,layout:"cover"};
  const openWork=(w,edit)=>{ setWorkId(w?w.id:edit?"new":works[0].id); setEditWork(!!edit); setScreen("work"); scrollTop(); };
  const work=workId==="new"?NEW_WORK:(works.find(w=>w.id===workId)||works[0]);
  const saveWork=(d)=>{ if(d.id==="new"){ const id="w"+Date.now(); const slug=(d.name||"realizacja").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,""); setWorks(ws=>[...ws,{...d,id,slug}]); setWorkId(id); } else { setWorks(ws=>ws.map(w=>w.id===d.id?d:w)); } setEditWork(false); };
  const deleteWork=(d)=>{ setWorks(ws=>ws.filter(w=>w.id!==d.id)); go("profile"); };
  const screens={
    hero:<window.Hero onGo={go} locale={t.locale} onLocale={(l)=>setTweak("locale",l)} phone={phone} />,
    profile:<window.PublicProfile key={t.viewer+t.screen+t.aboutOpen} profile={p} works={works} viewer={t.viewer} locale={t.locale} onLocale={(l)=>setTweak("locale",l)} phone={phone} rootRef={rootRef} aboutDefault={phone?false:t.aboutOpen} onOpenWork={(w)=>openWork(w,false)} onEditWork={(w)=>openWork(w,true)} onEnlarge={(w,i)=>setLightbox({work:w,index:i})} onChangeProfile={(patch)=>setProfile(prev=>({...prev,...patch}))} onGo={go} />,
    work:<window.WorkPage key={workId+String(editWork)} profile={p} work={work} viewer={t.viewer} locale={t.locale} phone={phone} editing={editWork} onBack={()=>go("profile")} onSave={saveWork} onDelete={deleteWork} onEnlarge={(w,i)=>setLightbox({work:w,index:i})} onGo={go} />,
    notfound:<window.NotFound onGo={go} locale={t.locale} phone={phone} />,
  };
  const page=screens[screen]||screens.profile;
  return (<React.Fragment>
    {phone ? <div className="phone-stage"><div className="phone"><div className="phone-screen"><div className="phone-scroll" ref={rootRef}>{page}</div></div></div></div> : page}
    {lightbox ? <window.Lightbox work={lightbox.work} index={lightbox.index} onClose={()=>setLightbox(null)} /> : null}
    <nav className="switcher" aria-label="Ekran">
      {[["profile","Profil"],["work","Realizacja"],["hero","Hero"],["notfound","404"]].map(([id,label])=>(
        <button key={id} aria-pressed={screen===id} onClick={()=>id==="work"?openWork(null,false):go(id)}>{label}</button>
      ))}
    </nav>
    <TweaksPanel>
      <TweakSection label="Kto patrzy" />
      <TweakRadio label="Widz" value={VIEWER_LABEL[t.viewer]} options={Object.values(VIEWER_LABEL)} onChange={(v)=>setTweak("viewer",VIEWER_VALUE[v])} />
      <TweakSection label="Ekran" />
      <TweakRadio label="Szerokość" value={phone?"Telefon":"Desktop"} options={["Desktop","Telefon"]} onChange={(v)=>setTweak("screen",v==="Telefon"?"phone":"desktop")} />
      <TweakRadio label="Język" value={t.locale==="pl"?"Polski":"English"} options={["Polski","English"]} onChange={(v)=>setTweak("locale",v==="Polski"?"pl":"en")} />
      <TweakSection label="Profil" />
      <TweakToggle label="Ma zdjęcie w tle" value={t.hasCover} onChange={(v)=>setTweak("hasCover",v)} />
      <TweakToggle label="Ma avatar" value={t.hasPhoto} onChange={(v)=>setTweak("hasPhoto",v)} />
      <TweakToggle label="Panel „o nas” otwarty na start (desktop)" value={t.aboutOpen} onChange={(v)=>setTweak("aboutOpen",v)} />
    </TweaksPanel>
  </React.Fragment>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<Site />);
</script></body></html>
