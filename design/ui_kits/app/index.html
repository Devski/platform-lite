<!-- @dsCard group="App" viewport="1280x860" name="App — login to profile editor" subtitle="Log in, 2FA, two-step onboarding, the LinkedIn-shaped profile editor, account settings" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Architektów 3d — app</title>
<link rel="stylesheet" href="../../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page)}#root{min-height:100vh}
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:var(--sp-6);z-index:60;display:flex;gap:2px;padding:4px;background:var(--surface-inverse);border-radius:var(--radius-full);box-shadow:var(--shadow-lift)}
.switcher button{appearance:none;border:0;cursor:pointer;background:transparent;color:rgba(255,255,255,.7);font-family:var(--font-sans);font-size:13px;font-weight:600;padding:6px 14px;border-radius:var(--radius-full)}
.switcher button[aria-pressed="true"]{background:#fff;color:var(--n-950)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head>
<body><div id="root"></div>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="Auth.jsx"></script>
<script type="text/babel" src="Onboarding.jsx"></script>
<script type="text/babel" src="ProfileEditor.jsx"></script>
<script type="text/babel" src="AccountSettings.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "twoFactorMethod": "otp",
  "hasPhoto": false,
  "locale": "en"
}/*EDITMODE-END*/;
const METHOD_VALUE = { "Authenticator app": "totp", "E-mail code": "otp" };
const METHOD_LABEL = { totp: "Authenticator app", otp: "E-mail code" };
function App(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [screen,setScreen]=React.useState("login");
  const [profile,setProfile]=React.useState({displayName:"Studio Praga",handle:"studio-praga",avatarUrl:null});
  React.useEffect(()=>{ setProfile(p=>({...p,avatarUrl:t.hasPhoto?"../../assets/landing-placeholder.webp":null})); },[t.hasPhoto]);
  const go=(s)=>{ setScreen(s); window.scrollTo(0,0); };
  const patch=(p)=>setProfile(prev=>({...prev,...p}));
  const screens={
    login:<window.Login onGo={go} />,
    register:<window.Register onGo={go} />,
    twofactor:<window.TwoFactor onGo={go} method={t.twoFactorMethod} />,
    onboarding:<window.Onboarding onDone={({name,handle})=>{patch({displayName:name,handle});go("profile");}} />,
    profile:<window.ProfileEditor profile={profile} onChange={patch} onNavigate={go} onViewPublic={()=>go("public")} />,
    account:<window.AccountSettings profile={profile} onNavigate={go} locale={t.locale} />,
    public:<window.PublicProfileStub profile={profile} onBack={()=>go("profile")} />,
  };
  return (<React.Fragment>
    {screens[screen]||screens.login}
    <nav className="switcher" aria-label="Screen">
      {[["login","Log in"],["register","Sign up"],["twofactor","2FA"],["onboarding","Onboarding"],["profile","Profile editor"],["account","Account"]].map(([id,label])=>(
        <button key={id} aria-pressed={screen===id} onClick={()=>go(id)}>{label}</button>
      ))}
    </nav>
    <TweaksPanel>
      <TweakSection label="Second factor" />
      <TweakRadio label="Enabled factor" value={METHOD_LABEL[t.twoFactorMethod]}
        options={["Authenticator app","E-mail code"]}
        onChange={(v)=>{ setTweak("twoFactorMethod", METHOD_VALUE[v]); go("twofactor"); }} />
      <TweakSection label="Language" />
      <TweakRadio label="Locale" value={t.locale==="pl"?"Polski":"English"} options={["Polski","English"]} onChange={(v)=>setTweak("locale",v==="Polski"?"pl":"en")} />
      <TweakSection label="Profile" />
      <TweakToggle label="Has a photo" value={t.hasPhoto} onChange={(v)=>setTweak("hasPhoto",v)} />
    </TweaksPanel>
  </React.Fragment>);
}
window.PublicProfileStub=function({profile,onBack}){
  const { Card, Avatar, Button, Icon } = window.ArchitektW3dDesignSystem_1d311d;
  return (<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"var(--sp-12)"}}>
    <Card padding="lg" style={{maxWidth:"var(--measure-form)",width:"100%",display:"flex",flexDirection:"column",alignItems:"center",gap:"var(--sp-5)",textAlign:"center"}}>
      <Avatar src={profile.avatarUrl} name={profile.displayName} size={128} />
      <h1 style={{font:"var(--type-h1)",letterSpacing:"var(--ls-heading)",color:"var(--text-strong)"}}>{profile.displayName}</h1>
      <p style={{font:"var(--type-mono)",color:"var(--text-muted)"}}>architektow3d.pl/{profile.handle}</p>
      <Button variant="quiet" onClick={onBack}><Icon name="arrow-left" size={16} tone="strong" />Back to editing</Button>
    </Card>
  </div>);
};
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
