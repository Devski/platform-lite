<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>

  return (<div>

    <div style={{display:"flex",gap:"var(--sp-8)",padding:"0 var(--sp-7) var(--sp-8)",maxWidth:1000,margin:"0 auto"}}><div><p className="cap">AboutPanel · owner · desktop</p><AboutPanel profile={P} open={open} onClose={()=>setOpen(false)} owner style={{position:"relative",top:"auto",bottom:"auto",height:620,width:380,boxShadow:"var(--shadow-md)",borderRadius:"var(--radius-card)",border:"1px solid var(--border-hairline)"}} /></div></div>
