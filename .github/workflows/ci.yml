name: CI

permissions:
  contents: read

# Pull requests test, `main` deploys (decision of 14.09.2026, SPEC §8).
#
# The tests run on the pull request and on a manual dispatch — the full path on
# demand stays (SPEC §6). A push to `main` or a release tag runs no test at all:
# it retags the image its pull request already built and checked, and dev
# deploys it. That is only as safe as the branch protection on `main` (SPEC §8):
# the required checks, "up to date before merging" and squash merges are what
# make the tree on `main` the tree the pull request tested. Without them this
# file deploys untested code — do not relax one without the other.
on:
  push:
    branches: [main]
    # SPEC §8 deploys prod manually, from an approval gate or a vX.Y.Z tag.
    # A branches filter excludes tags, so without this line tagging a release
    # ran no workflow at all.
    tags: ["v*.*.*"]
  # The default types only. The `preview` label is NOT a trigger here: a
  # label run would cancel the tests in flight, and its skipped jobs would
  # report `check` or `e2e-full` as passed for the pull request's commit —
  # a label could turn a red pull request green. Labels are preview.yml's.
  pull_request:
  workflow_dispatch: # the full path, on demand (SPEC §6)

concurrency:
  # A newer push to a pull request cancels the run it replaces. Anything else
  # — a push to main, a tag, a dispatch — is a group of its own and is never
  # cancelled, nor queued behind another: each one retags or deploys, and a
  # queued run is REPLACED by the next one to arrive. Deployments to dev are
  # serialised on the deploy-dev job instead, where replacing a stale one by a
  # newer one is exactly right.
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The only job that runs `pnpm build`. Pull requests and dispatch only.
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To list the pull request's files for the e2e-full filter. Read only.
      pull-requests: read
    outputs:
      e2e-full: ${{ steps.paths.outputs.e2e-full }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both point at the throwaway service container; it dies with the job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
    steps:
      # Decided here, in a job that always runs on a pull request and is itself
      # required: if this step broke, `check` is red and nothing merges. In a
      # job of its own, a failure would SKIP e2e-full — and a skipped required
      # check counts as passed.
      #
      # A skip-list, not a run-list: e2e-full stands down only when EVERY file
      # is one of these. Anything else — a config file nobody thought to list,
      # pnpm-workspace.yaml, .github/actions — runs it. deploy/ and scripts/ are
      # not what the browser suites exercise; deploy-config checks the former.
      - name: Does this change reach the browser suites?
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "e2e-full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A rename counts from both ends: a file moved out of src/ changed src/.
          if ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)'); then
            echo "::warning::Could not list the changed files — running e2e-full."
            echo "e2e-full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r file; do
            case "$file" in
              docs/* | tasks/* | deploy/* | scripts/* | SPEC.md | README.md | CLAUDE.md) ;;
              *) run=true; echo "e2e-full runs: $file"; break ;;
            esac
          done <<<"$files"
          [ "$run" = true ] || echo "::notice::Only docs, tasks, deploy or scripts changed — e2e-full stands down."
          echo "e2e-full=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      # `cache: pnpm` is actions/cache on the pnpm store, keyed on the hash of
      # pnpm-lock.yaml. Every job that installs uses it; cache-warm fills it.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first: integration tests run against DATABASE_URL_TEST and
      # need the relations in place before pnpm check reaches vitest.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build

  # #21: the image is built HERE and never on the machine it deploys to. A
  # Next.js build wants more CPU and memory than the dev instance has (1 vCPU,
  # 1.9 GB, Postgres already resident), while the running app is one Node
  # process of ~200 MB — so the box that comfortably runs the application
  # cannot build it, and does not have to (SPEC §3).
  #
  # Built once per TREE (14.09.2026). A pull request builds, migrates a
  # throwaway database with it, smoke-tests it and publishes it as
  # `tree-<hash of the source tree>`. The push that merges it asks the registry
  # for that tag first and, when it is there, only adds `:<sha>` and `:main`
  # (or `:vX.Y.Z`) to the image that was checked — no build, no migrate, no
  # smoke.
  #
  # Why that is the same image, and why ONLY together with the branch
  # protection on `main`: a pull request's run checks out refs/pull/N/merge,
  # the branch merged into the current `main`. Required to be up to date, the
  # branch already contains `main`, so that merge's tree is the branch's own
  # tree — and a squash merge of it writes exactly that tree to `main`. Same
  # tree, same hash, same tag. Without "up to date", `main` could move between
  # the test and the merge, the merged tree would be new, and the lookup would
  # miss and rebuild (safe, but untested by the browser suites). Without
  # required checks, the tag could name a tree whose tests failed.
  #
  # The trust this adds: a tree tag is published by a pull request's own run,
  # and a pull request runs the workflow as its branch wrote it. Anyone who can
  # push a branch here could publish a different image under a tree's tag. That
  # is the same set of people who can push to the repository at all, and a fork
  # never gets the registry credential (the guard on the login below).
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only this job publishes, and only to this repository's own registry
      # namespace. The package is private.
      packages: write
    # #53: the deployment migrates before it serves, so the image has to be
    # able to. A throwaway database is the only way to prove that the migrator
    # and the migration files actually survived into the runtime layer —
    # standalone prunes anything the pages do not reach.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_image_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REGISTRY: ghcr.io
    # Published as job outputs, and every deployment reads them from here.
    # Spelling the name a second time is what broke: the owner was renamed to
    # `Devski`, this job lowercased it and the two deploy jobs did not, so they
    # asked Docker for `ghcr.io/Devski/platform-lite` and got "repository name
    # must be lowercase".
    outputs:
      name: ${{ steps.image-name.outputs.name }}
      tree: ${{ steps.image-name.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the image name and the tree it is built from
        id: image-name
        run: |
          # Registry paths are case-sensitive while repository names are not.
          IMAGE="$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TREE=$TREE" >> "$GITHUB_ENV"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        id: login
        # Only from a branch in THIS repository: a fork's pull request gets no
        # registry credential, and must not — publishing an image built from
        # someone else's branch under our name is how a supply chain is
        # compromised. A manual dispatch does not publish either.
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Was this tree built and checked already?
        id: reuse
        if: github.event_name == 'push'
        run: |
          # Any failure to read — not only "no such tag" — builds: a lookup
          # that errs must cost minutes, never skip the checks.
          if docker buildx imagetools inspect "$IMAGE:tree-$TREE" > /dev/null 2>&1; then
            echo "::notice::tree-$TREE was built and checked by its pull request — retagging, not rebuilding."
            echo "reuse=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No image for tree-$TREE (a dispatch, or a push that bypassed a pull request) — building it."
            echo "reuse=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag the checked image for this push
        if: steps.reuse.outputs.reuse == 'true'
        run: |
          # The commit SHA is what a rollback names (SPEC §8); `main` and the
          # version tag move as they always did. Manifests only — no layer is
          # copied.
          tags=(--tag "$IMAGE:$GITHUB_SHA")
          case "$GITHUB_REF" in
            refs/heads/main) tags+=(--tag "$IMAGE:main") ;;
            refs/tags/v*) tags+=(--tag "$IMAGE:$GITHUB_REF_NAME") ;;
          esac
          docker buildx imagetools create "${tags[@]}" "$IMAGE:tree-$TREE"

      # Everything from here to the publish step runs only when the image is
      # being built: a reused one passed all of it on its pull request.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.reuse.outputs.reuse != 'true'
      - name: Build the production image
        if: steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Into the runner's Docker, for the checks below; published after them.
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:tree-${{ env.TREE }}
          # GitHub's own cache, not the registry: the package is private, and
          # layers stored there would be storage paid for. A pull request reads
          # what its earlier runs and `main` (cache-warm) wrote.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      # The deployment runs exactly this, between `pull` and `up`
      # (deploy/remote-deploy.sh). If the migrator or the .sql files were
      # pruned out of the standalone tree, it dies here instead of on the
      # instance — and a deployment that cannot migrate is one that would
      # leave an environment on new code and an old schema, which is #53.
      - name: The image can migrate a database
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          docker run --rm --network host             --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/platform_image_ci             --entrypoint node "$IMAGE:$GITHUB_SHA" /app/migrate.mjs
          # Idempotent by contract: every deploy runs it, most change nothing.
          docker run --rm --network host             --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/platform_image_ci             --entrypoint node "$IMAGE:$GITHUB_SHA" /app/migrate.mjs
          # And it really created the schema, rather than reporting success at
          # an empty database.
          docker run --rm --network host postgres:17             psql postgresql://postgres:postgres@localhost:5432/platform_image_ci             -tAc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('users','profiles','files')"             | grep -qx 3
      # An image that builds and an image that serves are different claims.
      # No database and no bucket here on purpose: every module that reads the
      # environment does so lazily, so the public landing page must render on
      # nothing but the image — the same property the database-less e2e job
      # relies on, checked here against the production compile instead of the
      # dev server.
      - name: The image starts and serves the landing page
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          docker run --detach --name smoke --publish 3000:3000             --env APP_ENV=ci             --env APP_URL=https://ci.invalid             "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl --silent --fail-with-body --output /dev/null http://localhost:3000/; then
              echo "serving after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "the container never served:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          # A7: anything whose APP_ENV is not `production` must say so in the
          # headers. The image is the last place that can get this wrong, and
          # it fails silently — a preview quietly indexed by Google.
          curl --silent --head http://localhost:3000/ | tee /tmp/headers
          grep -qi '^x-robots-tag: noindex' /tmp/headers
          # A route that makes Next write its prerender cache. The
          # container serves fine with an unwritable .next — it just
          # re-renders every request and logs EACCES forever, which is
          # invisible to any check that only looks at status codes.
          # Status deliberately ignored: this app has no robots route (A7
          # sends the header instead), so it 404s — and that 404 is exactly
          # what makes Next attempt the cache write being tested. What
          # matters is the log line, not the code.
          curl --silent --output /dev/null http://localhost:3000/robots.txt || true
          sleep 2
          if docker logs smoke 2>&1 | grep -qiE 'EACCES|permission denied'; then
            echo 'the container cannot write its own cache:'
            docker logs smoke 2>&1 | grep -iE 'EACCES|permission denied' | head -5
            exit 1
          fi
      - name: Container log
        if: always() && steps.reuse.outputs.reuse != 'true'
        run: docker logs smoke || true
      # After the smoke check, never before it: an image that does not serve
      # must not become something a deployment can reach for — and the tree
      # tag must not name one, since a push to main deploys it unchecked.
      # Also for a pull request: its preview (#31) runs this exact image, and
      # its merge reuses it.
      - name: Publish to the registry
        if: steps.login.outcome == 'success' && steps.reuse.outputs.reuse != 'true'
        run: |
          # The commit SHA is the real identity of a build, and what a rollback
          # names (SPEC §8); the tree tag is what a merge looks up.
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:tree-$TREE"
          case "$GITHUB_REF" in
            refs/heads/main)
              docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
              docker push "$IMAGE:main"
              ;;
            refs/tags/v*)
              docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:$GITHUB_REF_NAME"
              docker push "$IMAGE:$GITHUB_REF_NAME"
              ;;
          esac

  # deploy/ is configuration that nothing else exercises: it is read by the
  # instance, not by the application, so a typo there surfaces as a failed
  # deployment at the worst moment. Both files are checkable without a server.
  deploy-config:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml resolves
        # The values only have to exist — this proves the file parses and every
        # required variable is declared, not that any particular value is right.
        #
        # The empty .env is a stand-in, not a fix: the application's real
        # environment lives only on the instance (SPEC §7), and compose refuses
        # to read a file that is not there. Requiring it is the point — a
        # deployment with no environment must fail, not start half-configured.
        env:
          APP_IMAGE: ghcr.io/example/app:validate
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
          S3_UPLOAD_ORIGIN: https://endpoint.example.invalid
        run: |
          : > deploy/.env
          docker compose --file deploy/compose.yaml config --quiet
          rm deploy/.env
      - name: Caddyfile parses
        env:
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
          S3_UPLOAD_ORIGIN: https://endpoint.example.invalid
        run: |
          docker run --rm             --env SITE_ADDRESS --env S3_ORIGIN --env S3_UPLOAD_ORIGIN             --volume "$PWD/deploy:/w" --workdir /w             caddy:2-alpine caddy validate --config Caddyfile
      # The one line in that file whose absence is silent and expensive: Caddy
      # APPENDS to x-forwarded-for by default, and every rate limit in the app
      # keys on it (#8 review). A config that parses but has lost this line
      # would deploy happily and hand out unlimited password guesses.
      - name: The proxy overwrites x-forwarded-for
        run: grep -q 'header_up X-Forwarded-For {remote_host}' deploy/Caddyfile
      # The bucket answers on two origins and the browser uses both: images
      # come from the virtual-host address, while a presigned upload is signed
      # path-style and goes to the endpoint itself. Naming only one breaks
      # half the flow silently — photos display but cannot be uploaded, or the
      # reverse — while every server-side path keeps working. Cost a real
      # debugging session on 05.09.2026; pinned here so it cannot recur.
      - name: connect-src names both bucket origins
        run: grep -q "connect-src 'self' {\$S3_ORIGIN} {\$S3_UPLOAD_ORIGIN}" deploy/Caddyfile

      # A preview must be served the way dev is served. If it stopped reusing
      # the shared snippet and grew its own copy of the headers, the CSP would
      # drift between the environment a change is reviewed in and the one it
      # lands in — which is worth nothing as a preview.
      - name: Previews reuse the one site definition
        run: grep -q 'import site' deploy/preview-up.sh

      # #113: a preview runs on its own copy of dev, migrated by the pull
      # request's own image. Each line has a silent failure: without the copy
      # the preview is back on dev's database and every migration-carrying
      # pull request previews as a server error; without the migrate step the
      # copy carries main's schema, which is the same failure with more steps;
      # without DATABASE_URL on BOTH containers — the migrator and the app —
      # one of them keeps the instance .env's value and never sees the copy.
      #
      # Matched on the psql flag rather than the SQL alone: both files also
      # MENTION these statements, in a comment and in a by-hand instruction,
      # and a check a comment can satisfy is not a check.
      - name: A preview gets its own database, migrated, and is pointed at it
        run: |
          grep -q -- '-c "create database' deploy/preview-up.sh
          grep -q -- '/app/migrate.mjs' deploy/preview-up.sh
          test "$(grep -c -- '--env DATABASE_URL' deploy/preview-up.sh)" -ge 2
      # And it goes away again, both ways: when the pull request closes, and —
      # because an older branch's preview-up.sh knows nothing about copies —
      # whenever a copy is found with no container to own it. A copy of every
      # dev account's rows, left on a disk that has already filled once
      # (#119), is the cost of getting this wrong in the other direction.
      - name: Closing a preview drops its database
        run: grep -q -- '-c "drop database if exists' deploy/preview-down.sh
      - name: A copy with no container is swept up
        run: grep -q 'no \$container container to own it' deploy/preview-up.sh
      # The nightly copy of the databases (#168) must not copy the copies: a
      # preview clone is dev's data again, and a night with two previews open
      # would be three times the size of one without — which the shrink guard
      # reads as a copy gone bad, and then refuses every night after it.
      - name: The nightly copy skips the preview copies
        run: grep -q "not like 'platform..pr..%'" deploy/backup-db.sh

      # #167. The application's log goes to the host journal, because a log
      # kept in the container's own directory is deleted with the container —
      # which is every deploy. And the hourly check that reads it has to reach
      # the instance, or the report that exists to break the silence is itself
      # silently missing.
      - name: The application logs to the journal
        env:
          APP_IMAGE: ghcr.io/example/app:validate
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
          S3_UPLOAD_ORIGIN: https://endpoint.example.invalid
        run: |
          # Read from the resolved configuration, not grepped: a commented-out
          # line or one under the wrong service must not pass.
          : > deploy/.env
          docker compose --file deploy/compose.yaml config --format json |
            jq -e '.services.app.logging.driver == "journald" and .services.caddy.logging.driver == "journald"'
          rm deploy/.env
      - name: The operations check is shipped and installed
        run: |
          # Anchored to the scp line's indentation, so this line cannot satisfy itself.
          grep -qE '^ +deploy/backup-db.sh deploy/ops-check.sh' .github/workflows/ci.yml
          grep -q 'ExecStart=/bin/bash /opt/platform-lite/ops-check.sh' deploy/remote-deploy.sh
          # Defined is not called: the installer has to be invoked on a line of its own.
          grep -qxE 'install_ops_timer' deploy/remote-deploy.sh
          bash -n deploy/ops-check.sh

  # Smoke on every pull request (SPEC §6): the database-less project only. No
  # DATABASE_URL_TEST here on purpose — that is what makes this job prove the
  # fail-closed behaviour (401s, redirects to /login, 404s) with no database at
  # all. The e2e/db specs are not skipped here, they are never collected: the
  # project's testIgnore keeps them out entirely. A dispatch stands it down:
  # e2e-full runs the same project there.
  e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/chromium
      - run: pnpm test:e2e --project=chromium
      # The log is the server's whole stdout, and the dev e-mail transport
      # prints every message body — verification and reset links included. The
      # database behind those links is a throwaway container today, but the
      # artifact outlives the job by a week and the same accounts exist on dev
      # and in every preview's copy of it (#113), so the links never leave the
      # runner intact.
      - name: Redact action links from the server log
        if: failure()
        run: |
          if [ -f test-results/dev-server.log ]; then
            sed -i -E 's#https?://[^ ]*(token=|reset-password/)[^ ]*#<redacted>#g' test-results/dev-server.log
          fi
      # test-results/ carries the traces and the web server's own log — with
      # the github reporter there is no HTML report unless a run switches to
      # it, and the server log is the only copy of its output.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # BOTH projects, as two separate Playwright invocations on purpose. Each
  # starts its own web server, which is the only way to give one project a
  # server with no database and the other a server with one: Next takes an
  # exclusive lock on its dist directory, so the two servers cannot coexist,
  # only follow each other. DATABASE_URL and DATABASE_URL_TEST are therefore
  # set per step, never on the job — a job-level value would reach the
  # database-less server too.
  e2e-full:
    # On every pull request that changes code (#40), and on a dispatch. It ran
    # by hand until 06.09.2026, and in that arrangement two faults reached dev
    # and were found there by a person using the product.
    #
    # Once per change since 14.09.2026, not twice: the run on `main` that used
    # to gate the deployment is gone, because branch protection makes the tree
    # on `main` the tree tested here (SPEC §8). A pull request that touches
    # only docs, tasks, deploy or scripts skips it — `check` decides, see its
    # first step. A job skipped by its `if` reports success, which is what a
    # required check accepts; a skipped STEP would too, but would still pay for
    # the runner, the database container and the install.
    #
    # The gate has to carry the build verdict for the same commit, not just the
    # browser one — and a push leaves `check` skipped, which skips this too.
    needs: [check]
    if: needs.check.outputs.e2e-full == 'true'
    runs-on: ubuntu-latest
    # Two cold `next dev` boots, a browser install and up to two attempts per
    # database spec do not fit 30 minutes on a bad run.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/chromium
      # Migrations first: the journey signs an account up against these
      # relations, so they must exist before the web server takes a request.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      - name: Fail-closed behaviour, against a server with no database
        run: pnpm test:e2e --project=chromium
      - name: The #20 journey and the reset round trip, against the database
        run: pnpm test:e2e --project=chromium-db
        env:
          # What playwright.config.ts hands the web server as DATABASE_URL.
          # The throwaway service container; it dies with the job.
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      # The log is the server's whole stdout, and the dev e-mail transport
      # prints every message body — verification and reset links included. The
      # database behind those links is a throwaway container today, but the
      # artifact outlives the job by a week and the same accounts exist on dev
      # and in every preview's copy of it (#113), so the links never leave the
      # runner intact.
      - name: Redact action links from the server log
        if: failure()
        run: |
          if [ -f test-results/dev-server.log ]; then
            sed -i -E 's#https?://[^ ]*(token=|reset-password/)[^ ]*#<redacted>#g' test-results/dev-server.log
          fi
      # test-results/ carries the traces and the web server's own log — with
      # the github reporter there is no HTML report unless a run switches to
      # it, and the server log is the only copy of its output.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Caches are scoped: a pull request restores what its own earlier runs saved,
  # or what `main` saved — never another pull request's. Since `main` stopped
  # installing and building (14.09.2026) nothing else writes main's copy, so
  # after a dependency change every new pull request would start cold for good.
  # This refills it, and only when the push changed what the caches are keyed
  # on: the lockfile (pnpm store, the Docker dependency layer), package.json
  # (the Playwright version) or the Dockerfile.
  cache-warm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # a squash merge is one commit: HEAD^ is main before it
      - name: Did this push change what the caches are keyed on?
        id: keys
        run: |
          # A diff that cannot be read (no parent) counts as a change.
          if git diff --quiet HEAD^ HEAD -- pnpm-lock.yaml pnpm-workspace.yaml package.json Dockerfile 2> /dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.keys.outputs.changed == 'true'
      - uses: actions/setup-node@v7
        if: steps.keys.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.keys.outputs.changed == 'true'
      - uses: ./.github/actions/chromium
        if: steps.keys.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.keys.outputs.changed == 'true'
      - name: Build the image into the cache only
        if: steps.keys.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  # SPEC §8: dev deploys automatically from `main`. Tags are the production
  # path and stay manual, so this job deliberately does not run on them.
  #
  # Until the instance side of #21 is wired — secrets, open ports, the
  # /opt/platform-lite directory — this reports itself skipped rather than
  # failing every push. A red gate everyone learns to ignore is worse than no
  # gate at all.
  deploy-dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Nothing reaches the instance that has not passed the gate, built a
    # serving image and cleared BOTH browser suites (#40) — on its pull
    # request, required by branch protection, since 14.09.2026. The push
    # itself runs no test; `image` is the one job left to wait for, and a
    # skipped job would fail `needs` anyway.
    needs: [image]
    # One deployment at a time. A newer push waiting here replaces an older
    # one still waiting, which is right: it carries that change too.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Handed to the instance for the length of this run so it can pull.
      packages: read
    steps:
      - name: Is the instance wired up yet?
        id: wired
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No DEV_SSH_HOST secret yet — nothing to deploy to. See docs/deployment.md."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.wired.outputs.wired == 'true'
      - name: Authorize this run against the instance
        if: steps.wired.outputs.wired == 'true'
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned, never StrictHostKeyChecking=no: a deploy that trusts
          # whatever answers at that address is a deploy anyone on the path
          # can take over.
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ship the deployment files
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy \
            deploy/compose.yaml deploy/Caddyfile deploy/remote-deploy.sh \
            deploy/backup-db.sh deploy/ops-check.sh \
            "$HOST:/opt/platform-lite/"
      - name: Pull the image and restart the container
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          # Short-lived and scoped to this run. The instance is granted a pull
          # for the length of the deployment and keeps no standing registry
          # credential of its own (G9).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          # By tree: the image its pull request checked, whether this push
          # rebuilt it or only retagged it. /opt/platform-lite/deployed-images
          # lists these names, and a rollback runs one of them (SPEC §8).
          APP_IMAGE: ${{ needs.image.outputs.name }}:tree-${{ needs.image.outputs.tree }}
        run: |
          ssh -i ~/.ssh/id_deploy "$HOST" \
            "APP_IMAGE='$APP_IMAGE' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' \
             bash /opt/platform-lite/remote-deploy.sh"

  preview:
    # #31: a pull request gets its own running copy, at its own hostname, so a
    # change can be looked at before it is merged — on request since
    # 14.09.2026, by the `preview` label (SPEC §8). This job starts it for a
    # push to a pull request that already carries the label; preview.yml
    # starts it when the label is added, and takes it down when the label is
    # removed or the pull request closes.
    #
    # Only for branches in THIS repository — a fork's pull request has no
    # access to the deploy key, and giving it one would hand the instance to
    # anyone who can open a PR.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    # The gate and a serving image, same bar as dev. Not e2e-smoke: a preview
    # exists to be looked at, and a browser test failing is often the reason
    # you want to look. `deploy-config` IS required — it validates the proxy
    # configuration that previews are now part of.
    needs: [check, image, deploy-config]
    # Shared with preview.yml: removing the label cancels a start in flight.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    # What preview-up.yml asks for; a called workflow gets no more than this.
    permissions:
      contents: read
      packages: read
      pull-requests: read
      checks: read
    uses: ./.github/workflows/preview-up.yml
    secrets: inherit
