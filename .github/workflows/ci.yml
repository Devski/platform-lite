name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    # SPEC §8 deploys prod manually, from an approval gate or a vX.Y.Z tag.
    # A branches filter excludes tags, so without this line tagging a release
    # ran no workflow at all and "full e2e before a prod deployment" (SPEC §6)
    # meant "if someone remembers to press Run workflow".
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch: # the same full path, on demand (SPEC §6)

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded runs only for PRs; main and dispatch runs queue instead,
  # so an auto-deployed commit always carries a completed verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every event, the release tag and the manual dispatch included: this is
  # the only job that runs `pnpm build`, and the pre-deploy path used to skip
  # it — leaving a gate that never compiled the production build it gates.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both point at the throwaway service container; it dies with the job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first: integration tests run against DATABASE_URL_TEST and
      # need the relations in place before pnpm check reaches vitest.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build

  # #21: the image is built HERE and never on the machine it deploys to. A
  # Next.js build wants more CPU and memory than the dev instance has (1 vCPU,
  # 1.9 GB, Postgres already resident), while the running app is one Node
  # process of ~200 MB — so the box that comfortably runs the application
  # cannot build it, and does not have to (SPEC §3).
  #
  # Building on every event is what keeps the Dockerfile honest: nothing else
  # in the gate compiles it, and a broken image would otherwise surface at
  # deploy time. Publishing to a registry and the deploy itself arrive with
  # the instance side of #21 — this job proves the artifact, not the delivery.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only this job publishes, and only to this repository's own registry
      # namespace. The repository is private, so the package is too.
      packages: write
    env:
      # Registry paths are case-sensitive while repository names are not, so
      # normalize rather than depend on how the repo happens to be spelled.
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the image name
        run: echo "IMAGE=$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - name: Build the production image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .
      # An image that builds and an image that serves are different claims.
      # No database and no bucket here on purpose: every module that reads the
      # environment does so lazily, so the public landing page must render on
      # nothing but the image — the same property the database-less e2e job
      # relies on, checked here against the production compile instead of the
      # dev server.
      - name: The image starts and serves the landing page
        run: |
          docker run --detach --name smoke --publish 3000:3000             --env APP_ENV=ci             --env APP_URL=https://ci.invalid             "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl --silent --fail-with-body --output /dev/null http://localhost:3000/; then
              echo "serving after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "the container never served:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          # A7: anything whose APP_ENV is not `production` must say so in the
          # headers. The image is the last place that can get this wrong, and
          # it fails silently — a preview quietly indexed by Google.
          curl --silent --head http://localhost:3000/ | tee /tmp/headers
          grep -qi '^x-robots-tag: noindex' /tmp/headers
      - name: Container log
        if: always()
        run: docker logs smoke || true
      # After the smoke check, never before it: an image that does not serve
      # must not become something a deployment can reach for. Pull requests
      # build and check but publish nothing — nothing deploys from them.
      - name: Publish to the registry
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          # The commit SHA is the real identity of a build, and what a deploy
          # pins: rolling back is redeploying an older one (SPEC §8).
          docker push "$IMAGE:$GITHUB_SHA"
      - name: Move the `main` tag to this build
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:main"
          docker push "$IMAGE:main"
      - name: Tag a release build with its version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:${GITHUB_REF_NAME}"
          docker push "$IMAGE:${GITHUB_REF_NAME}"

  # deploy/ is configuration that nothing else exercises: it is read by the
  # instance, not by the application, so a typo there surfaces as a failed
  # deployment at the worst moment. Both files are checkable without a server.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml resolves
        # The values only have to exist — this proves the file parses and every
        # required variable is declared, not that any particular value is right.
        #
        # The empty .env is a stand-in, not a fix: the application's real
        # environment lives only on the instance (SPEC §7), and compose refuses
        # to read a file that is not there. Requiring it is the point — a
        # deployment with no environment must fail, not start half-configured.
        env:
          APP_IMAGE: ghcr.io/example/app:validate
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
        run: |
          : > deploy/.env
          docker compose --file deploy/compose.yaml config --quiet
          rm deploy/.env
      - name: Caddyfile parses
        env:
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
        run: |
          docker run --rm             --env SITE_ADDRESS --env S3_ORIGIN             --volume "$PWD/deploy:/w" --workdir /w             caddy:2-alpine caddy validate --config Caddyfile
      # The one line in that file whose absence is silent and expensive: Caddy
      # APPENDS to x-forwarded-for by default, and every rate limit in the app
      # keys on it (#8 review). A config that parses but has lost this line
      # would deploy happily and hand out unlimited password guesses.
      - name: The proxy overwrites x-forwarded-for
        run: grep -q 'header_up X-Forwarded-For {remote_host}' deploy/Caddyfile

  # Smoke on every push and PR (SPEC §6): the database-less project only. No
  # DATABASE_URL_TEST here on purpose — that is what makes this job prove the
  # fail-closed behaviour (401s, redirects to /login, 404s) with no database at
  # all. The e2e/db specs are not skipped here, they are never collected: the
  # project's testIgnore keeps them out entirely.
  e2e-smoke:
    if: ${{ !(github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e --project=chromium
      # The log is the server's whole stdout, and the dev e-mail transport
      # prints every message body — verification and reset links included. The
      # database behind those links is a throwaway container today, but the
      # artifact outlives the job by a week and SPEC §8 puts PR previews on the
      # shared dev database, so the links never leave the runner intact.
      - name: Redact action links from the server log
        if: failure()
        run: |
          if [ -f test-results/dev-server.log ]; then
            sed -i -E 's#https?://[^ ]*(token=|reset-password/)[^ ]*#<redacted>#g' test-results/dev-server.log
          fi
      # test-results/ carries the traces and the web server's own log — with
      # the github reporter there is no HTML report unless a run switches to
      # it, and the server log is the only copy of its output.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Pre-prod-deploy path (SPEC §6): a vX.Y.Z tag or a manual dispatch. It
  # covers BOTH projects, because e2e-smoke stands down on those events — and it runs them as two separate
  # Playwright invocations on purpose. Each starts its own web server, which
  # is the only way to give one project a server with no database and the
  # other a server with one: Next takes an exclusive lock on its dist
  # directory, so the two servers cannot coexist, only follow each other.
  # DATABASE_URL and DATABASE_URL_TEST are therefore set per step, never on
  # the job — a job-level value would reach the database-less server too.
  e2e-full:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    # The gate has to carry the build verdict for the same commit, not just the
    # browser one; a skipped `check` would skip this job with it.
    needs: [check]
    runs-on: ubuntu-latest
    # Two cold `next dev` boots, a browser install and up to two attempts per
    # database spec do not fit 30 minutes on a bad run.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      # Migrations first: the journey signs an account up against these
      # relations, so they must exist before the web server takes a request.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      - name: Fail-closed behaviour, against a server with no database
        run: pnpm test:e2e --project=chromium
      - name: The #20 journey and the reset round trip, against the database
        run: pnpm test:e2e --project=chromium-db
        env:
          # What playwright.config.ts hands the web server as DATABASE_URL.
          # The throwaway service container; it dies with the job.
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      # The log is the server's whole stdout, and the dev e-mail transport
      # prints every message body — verification and reset links included. The
      # database behind those links is a throwaway container today, but the
      # artifact outlives the job by a week and SPEC §8 puts PR previews on the
      # shared dev database, so the links never leave the runner intact.
      - name: Redact action links from the server log
        if: failure()
        run: |
          if [ -f test-results/dev-server.log ]; then
            sed -i -E 's#https?://[^ ]*(token=|reset-password/)[^ ]*#<redacted>#g' test-results/dev-server.log
          fi
      # test-results/ carries the traces and the web server's own log — with
      # the github reporter there is no HTML report unless a run switches to
      # it, and the server log is the only copy of its output.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # SPEC §8: dev deploys automatically from `main`. Tags are the production
  # path and stay manual, so this job deliberately does not run on them.
  #
  # Until the instance side of #21 is wired — secrets, open ports, the
  # /opt/platform-lite directory — this reports itself skipped rather than
  # failing every push. A red gate everyone learns to ignore is worse than no
  # gate at all.
  deploy-dev:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # Nothing reaches the instance that has not passed the gate, built a
    # serving image and cleared the browser smoke.
    needs: [check, image, deploy-config, e2e-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Handed to the instance for the length of this run so it can pull.
      packages: read
    steps:
      - name: Is the instance wired up yet?
        id: wired
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No DEV_SSH_HOST secret yet — nothing to deploy to. See docs/deployment.md."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.wired.outputs.wired == 'true'
      - name: Authorize this run against the instance
        if: steps.wired.outputs.wired == 'true'
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned, never StrictHostKeyChecking=no: a deploy that trusts
          # whatever answers at that address is a deploy anyone on the path
          # can take over.
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ship the deployment files
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy \
            deploy/compose.yaml deploy/Caddyfile deploy/remote-deploy.sh \
            "$HOST:/opt/platform-lite/"
      - name: Pull the image and restart the container
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          # Short-lived and scoped to this run. The instance is granted a pull
          # for the length of the deployment and keeps no standing registry
          # credential of its own (G9).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          # The commit SHA is what a deployment pins, so rolling back is
          # re-running this against an older one (SPEC §8).
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "$HOST" \
            "APP_IMAGE='$APP_IMAGE' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' \
             bash /opt/platform-lite/remote-deploy.sh"
