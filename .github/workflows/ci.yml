name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # full e2e for the pre-prod-deploy path (SPEC §6)

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded runs only for PRs; main and dispatch runs queue instead,
  # so an auto-deployed commit always carries a completed verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both point at the throwaway service container; it dies with the job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first: integration tests run against DATABASE_URL_TEST and
      # need the relations in place before pnpm check reaches vitest.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build

  e2e-smoke:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: playwright-report/
          retention-days: 7

  # Pre-prod-deploy path (SPEC §6). Today it runs the same suite as the smoke
  # job; the smoke/full split gets real content with task #20.
  e2e-full:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: playwright-report/
          retention-days: 7
