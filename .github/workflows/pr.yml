name: Pull request

# Pull requests test, `main` deploys (decision of 14.09.2026, SPEC §8). Every
# test lives here; deploy.yml runs none and manual.yml calls this file.
#
# One required status check: `ci-ok`, at the bottom. Branch protection names
# it and nothing else, so a job can be added, renamed or skipped here without
# touching the settings — and a job that must pass cannot be forgotten there.
#
# What makes deploy.yml safe is here plus the protection on `main`: `ci-ok`
# required, branches up to date before merging, squash merges only. Do not
# relax one without the other.

on:
  # labeled/unlabeled: the `preview` label starts and removes a preview. A label
  # event re-runs the whole file — deliberately: a run that skipped the tests
  # would report `ci-ok` green for the commit, whatever the tests said before.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # manual.yml: the same path on demand (SPEC §6), with `full` set.
  workflow_call:
    inputs:
      full:
        description: Run e2e-full whatever the change touches.
        type: boolean
        default: false

permissions:
  contents: read

# A newer event on the same pull request cancels the run it replaces. The run
# id stands in for a manual call, which has no pull request: every dispatch is
# its own group, never cancelled by another.
concurrency:
  group: pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # The only job that runs `pnpm build`.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Both point at the throwaway service container; it dies with the job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      # `cache: pnpm` is actions/cache on the pnpm store, keyed on the hash of
      # pnpm-lock.yaml — in every job that installs.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Migrations first: integration tests run against DATABASE_URL_TEST and
      # need the relations in place before pnpm check reaches vitest.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
      - run: pnpm check
      - run: pnpm build

  # Whether the change reaches what the browser suites exercise. A job of its
  # own, and needed by `ci-ok`: if it fails, e2e-full is skipped — and a
  # skipped e2e-full is accepted — so its failure must fail the gate by itself.
  changes:
    # A manual run wants the whole path; there is no pull request to diff.
    if: ${{ !inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # paths-filter lists a pull request's files through the API. Read only.
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Two beyond Dawid's list, both of which change what the suites run:
          # the composite action that installs their browser, and the pnpm
          # workspace file, which decides which dependencies may build.
          filters: |
            code:
              - 'src/**'
              - 'e2e/**'
              - 'drizzle/**'
              - 'messages/**'
              - 'public/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'next.config.ts'
              - 'playwright.config.ts'
              - 'vitest.config.mts'
              - 'tsconfig.json'
              - 'Dockerfile'
              - '.github/workflows/**'
              - '.github/actions/**'

  # #21: the image is built HERE and never on the machine it deploys to. A
  # Next.js build wants more CPU and memory than the dev instance has (1 vCPU,
  # 1.9 GB, Postgres already resident), while the running app is one Node
  # process of ~200 MB — so the box that comfortably runs the application
  # cannot build it, and does not have to (SPEC §3).
  #
  # Built once per TREE (14.09.2026). The image is published as `:<sha>` and as
  # `tree-<hash of the source tree>`, and deploy.yml deploys the tree tag of the
  # commit that lands on `main` — it never builds.
  #
  # Why that is the image this run checked, and why ONLY together with the
  # branch protection on `main`: this run checks out refs/pull/N/merge, the
  # branch merged into the current `main`. Required to be up to date, the
  # branch already contains `main`, so that merge's tree is the branch's own
  # tree — and a squash merge of it writes exactly that tree to `main`. Same
  # tree, same hash, same tag. Without "up to date", `main` could move between
  # this run and the merge, the merged tree would have no image, and deploy.yml
  # would refuse it. Without `ci-ok` required, the tag could name a tree whose
  # tests failed: the image is published before the browser suites finish.
  #
  # A tag is only a name: a pull request runs this file as its branch wrote it,
  # so any branch here could publish a different image under another tree's
  # tag. What closes that is the signature at the end of this job. Each
  # published image is attested by this workflow, and the attestation records
  # the commit the run checked out. deploy.yml deploys an image only if one of
  # its attestations names a commit whose tree IS the tree being deployed. A
  # branch that pushed a forged image under that tag ran from a different
  # commit, so its signature names a different tree. And a commit with that
  # exact tree ran exactly the reviewed code, this file included. A fork never
  # gets the registry credential or an identity to sign with.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Only this job publishes, and only to this repository's own registry
      # namespace. The package is private.
      packages: write
      # To sign what it published (below): a short-lived OIDC identity for
      # Sigstore, and the attestation stored in this repository.
      id-token: write
      attestations: write
    # #53: the deployment migrates before it serves, so the image has to be
    # able to. A throwaway database is the only way to prove that the migrator
    # and the migration files actually survived into the runtime layer —
    # standalone prunes anything the pages do not reach.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_image_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REGISTRY: ghcr.io
    # Published as job outputs, and the preview reads them from here. Spelling
    # the name a second time is what broke once: the owner was renamed to
    # `Devski`, this job lowercased it and the deploy jobs did not.
    outputs:
      name: ${{ steps.image-name.outputs.name }}
      tree: ${{ steps.image-name.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve the image name and the tree it is built from
        id: image-name
        run: |
          # Registry paths are case-sensitive while repository names are not.
          IMAGE="$REGISTRY/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "TREE=$TREE" >> "$GITHUB_ENV"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
      - name: Log in to the registry
        id: login
        # Only from a branch in THIS repository: a fork's pull request gets no
        # registry credential, and must not — publishing an image built from
        # someone else's branch under our name is how a supply chain is
        # compromised. A manual run has no pull request, and publishes nothing.
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      # Built by every run, never taken from an earlier one — even for a tree
      # that already has a tag. Anyone who can push a branch can publish under
      # any tree's name, so a tag this run did not write proves nothing about
      # what this run checked. Rebuilding overwrites it with the image checked
      # below.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          # Into the runner's Docker, for the checks below; published after them.
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:tree-${{ env.TREE }}
          # GitHub's own cache, not the registry: the package is private, and
          # layers stored there would be storage paid for.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      # The deployment runs exactly this, between `pull` and `up`
      # (deploy/remote-deploy.sh). If the migrator or the .sql files were
      # pruned out of the standalone tree, it dies here instead of on the
      # instance — and a deployment that cannot migrate is one that would
      # leave an environment on new code and an old schema, which is #53.
      - name: The image can migrate a database
        run: |
          docker run --rm --network host             --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/platform_image_ci             --entrypoint node "$IMAGE:$GITHUB_SHA" /app/migrate.mjs
          # Idempotent by contract: every deploy runs it, most change nothing.
          docker run --rm --network host             --env DATABASE_URL=postgresql://postgres:postgres@localhost:5432/platform_image_ci             --entrypoint node "$IMAGE:$GITHUB_SHA" /app/migrate.mjs
          # And it really created the schema, rather than reporting success at
          # an empty database.
          docker run --rm --network host postgres:17             psql postgresql://postgres:postgres@localhost:5432/platform_image_ci             -tAc "select count(*) from information_schema.tables where table_schema='public' and table_name in ('users','profiles','files')"             | grep -qx 3
      # An image that builds and an image that serves are different claims.
      # No database and no bucket here on purpose: every module that reads the
      # environment does so lazily, so the public landing page must render on
      # nothing but the image — the same property the database-less e2e job
      # relies on, checked here against the production compile instead of the
      # dev server.
      - name: The image starts and serves the landing page
        run: |
          docker run --detach --name smoke --publish 3000:3000             --env APP_ENV=ci             --env APP_URL=https://ci.invalid             "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            if curl --silent --fail-with-body --output /dev/null http://localhost:3000/; then
              echo "serving after ${i}s"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "the container never served:"
              docker logs smoke
              exit 1
            fi
            sleep 1
          done
          # A7: anything whose APP_ENV is not `production` must say so in the
          # headers. The image is the last place that can get this wrong, and
          # it fails silently — a preview quietly indexed by Google.
          curl --silent --head http://localhost:3000/ | tee /tmp/headers
          grep -qi '^x-robots-tag: noindex' /tmp/headers
          # A route that makes Next write its prerender cache. The
          # container serves fine with an unwritable .next — it just
          # re-renders every request and logs EACCES forever, which is
          # invisible to any check that only looks at status codes.
          # Status deliberately ignored: this app has no robots route (A7
          # sends the header instead), so it 404s — and that 404 is exactly
          # what makes Next attempt the cache write being tested. What
          # matters is the log line, not the code.
          curl --silent --output /dev/null http://localhost:3000/robots.txt || true
          sleep 2
          if docker logs smoke 2>&1 | grep -qiE 'EACCES|permission denied'; then
            echo 'the container cannot write its own cache:'
            docker logs smoke 2>&1 | grep -iE 'EACCES|permission denied' | head -5
            exit 1
          fi
      - name: Container log
        if: always()
        run: docker logs smoke || true
      # After the smoke check, never before it: an image that does not serve
      # must not become something a deployment can reach for.
      - name: Publish to the registry
        id: publish
        if: steps.login.outcome == 'success'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:tree-$TREE"
          digest=$(docker buildx imagetools inspect "$IMAGE:tree-$TREE" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in
            sha256:*) echo "digest=$digest" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Could not read the digest just published: '$digest'"; exit 1 ;;
          esac
      # Signed with this run's identity — this repository, pr.yml, the commit
      # checked out — and bound to the image's digest, not to a tag.
      - name: Sign what was published
        if: steps.login.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
      # deploy.yml's own check, run against what was just signed. A check that
      # only ever ran on `main` would find its first bug at a deployment.
      - name: The image passes the check deploy.yml will make
        if: steps.login.outcome == 'success'
        uses: ./.github/actions/verified-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # deploy/ is configuration that nothing else exercises: it is read by the
  # instance, not by the application, so a typo there surfaces as a failed
  # deployment at the worst moment. Both files are checkable without a server.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: compose.yaml resolves
        # The values only have to exist — this proves the file parses and every
        # required variable is declared, not that any particular value is right.
        #
        # The empty .env is a stand-in, not a fix: the application's real
        # environment lives only on the instance (SPEC §7), and compose refuses
        # to read a file that is not there. Requiring it is the point — a
        # deployment with no environment must fail, not start half-configured.
        env:
          APP_IMAGE: ghcr.io/example/app:validate
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
          S3_UPLOAD_ORIGIN: https://endpoint.example.invalid
        run: |
          : > deploy/.env
          docker compose --file deploy/compose.yaml config --quiet
          rm deploy/.env
      - name: Caddyfile parses
        env:
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
          S3_UPLOAD_ORIGIN: https://endpoint.example.invalid
        run: |
          docker run --rm             --env SITE_ADDRESS --env S3_ORIGIN --env S3_UPLOAD_ORIGIN             --volume "$PWD/deploy:/w" --workdir /w             caddy:2-alpine caddy validate --config Caddyfile
      # The one line in that file whose absence is silent and expensive: Caddy
      # APPENDS to x-forwarded-for by default, and every rate limit in the app
      # keys on it (#8 review). A config that parses but has lost this line
      # would deploy happily and hand out unlimited password guesses.
      - name: The proxy overwrites x-forwarded-for
        run: grep -q 'header_up X-Forwarded-For {remote_host}' deploy/Caddyfile
      # The bucket answers on two origins and the browser uses both: images
      # come from the virtual-host address, while a presigned upload is signed
      # path-style and goes to the endpoint itself. Naming only one breaks
      # half the flow silently — photos display but cannot be uploaded, or the
      # reverse — while every server-side path keeps working. Cost a real
      # debugging session on 05.09.2026; pinned here so it cannot recur.
      - name: connect-src names both bucket origins
        run: grep -q "connect-src 'self' {\$S3_ORIGIN} {\$S3_UPLOAD_ORIGIN}" deploy/Caddyfile

      # A preview must be served the way dev is served. If it stopped reusing
      # the shared snippet and grew its own copy of the headers, the CSP would
      # drift between the environment a change is reviewed in and the one it
      # lands in — which is worth nothing as a preview.
      - name: Previews reuse the one site definition
        run: grep -q 'import site' deploy/preview-up.sh

      # #113: a preview runs on its own copy of dev, migrated by the pull
      # request's own image. Each line has a silent failure: without the copy
      # the preview is back on dev's database and every migration-carrying
      # pull request previews as a server error; without the migrate step the
      # copy carries main's schema, which is the same failure with more steps;
      # without DATABASE_URL on BOTH containers — the migrator and the app —
      # one of them keeps the instance .env's value and never sees the copy.
      #
      # Matched on the psql flag rather than the SQL alone: both files also
      # MENTION these statements, in a comment and in a by-hand instruction,
      # and a check a comment can satisfy is not a check.
      - name: A preview gets its own database, migrated, and is pointed at it
        run: |
          grep -q -- '-c "create database' deploy/preview-up.sh
          grep -q -- '/app/migrate.mjs' deploy/preview-up.sh
          test "$(grep -c -- '--env DATABASE_URL' deploy/preview-up.sh)" -ge 2
      # And it goes away again, both ways: when the pull request closes, and —
      # because an older branch's preview-up.sh knows nothing about copies —
      # whenever a copy is found with no container to own it. A copy of every
      # dev account's rows, left on a disk that has already filled once
      # (#119), is the cost of getting this wrong in the other direction.
      - name: Closing a preview drops its database
        run: grep -q -- '-c "drop database if exists' deploy/preview-down.sh
      - name: A copy with no container is swept up
        run: grep -q 'no \$container container to own it' deploy/preview-up.sh
      # The nightly copy of the databases (#168) must not copy the copies: a
      # preview clone is dev's data again, and a night with two previews open
      # would be three times the size of one without — which the shrink guard
      # reads as a copy gone bad, and then refuses every night after it.
      - name: The nightly copy skips the preview copies
        run: grep -q "not like 'platform..pr..%'" deploy/backup-db.sh

      # #167. The application's log goes to the host journal, because a log
      # kept in the container's own directory is deleted with the container —
      # which is every deploy. And the hourly check that reads it has to reach
      # the instance, or the report that exists to break the silence is itself
      # silently missing.
      - name: The application logs to the journal
        env:
          APP_IMAGE: ghcr.io/example/app:validate
          SITE_ADDRESS: dev.example.invalid
          S3_ORIGIN: https://bucket.example.invalid
          S3_UPLOAD_ORIGIN: https://endpoint.example.invalid
        run: |
          # Read from the resolved configuration, not grepped: a commented-out
          # line or one under the wrong service must not pass.
          : > deploy/.env
          docker compose --file deploy/compose.yaml config --format json |
            jq -e '.services.app.logging.driver == "journald" and .services.caddy.logging.driver == "journald"'
          rm deploy/.env
      - name: The operations check is shipped and installed
        run: |
          # Anchored to the scp line's indentation, so this line cannot satisfy itself.
          grep -qE '^ +deploy/backup-db.sh deploy/ops-check.sh' .github/workflows/deploy.yml
          grep -q 'ExecStart=/bin/bash /opt/platform-lite/ops-check.sh' deploy/remote-deploy.sh
          # Defined is not called: the installer has to be invoked on a line of its own.
          grep -qxE 'install_ops_timer' deploy/remote-deploy.sh
          bash -n deploy/ops-check.sh

  # Smoke (SPEC §6): the database-less project only. No DATABASE_URL_TEST here
  # on purpose — that is what makes this job prove the fail-closed behaviour
  # (401s, redirects to /login, 404s) with no database at all. The e2e/db specs
  # are not skipped here, they are never collected: the project's testIgnore
  # keeps them out entirely.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/chromium
      - run: pnpm test:e2e --project=chromium
      # The log is the server's whole stdout, and the dev e-mail transport
      # prints every message body — verification and reset links included. The
      # database behind those links is a throwaway container today, but the
      # artifact outlives the job by a week and the same accounts exist on dev
      # and in every preview's copy of it (#113), so the links never leave the
      # runner intact.
      - name: Redact action links from the server log
        if: failure()
        run: |
          if [ -f test-results/dev-server.log ]; then
            sed -i -E 's#https?://[^ ]*(token=|reset-password/)[^ ]*#<redacted>#g' test-results/dev-server.log
          fi
      # test-results/ carries the traces and the web server's own log — with
      # the github reporter there is no HTML report unless a run switches to
      # it, and the server log is the only copy of its output.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # BOTH projects, as two separate Playwright invocations on purpose. Each
  # starts its own web server, which is the only way to give one project a
  # server with no database and the other a server with one: Next takes an
  # exclusive lock on its dist directory, so the two servers cannot coexist,
  # only follow each other. DATABASE_URL and DATABASE_URL_TEST are therefore
  # set per step, never on the job — a job-level value would reach the
  # database-less server too.
  e2e-full:
    # On every pull request that changes code (#40), and on every manual run.
    # It ran by hand until 06.09.2026, and in that arrangement two faults
    # reached dev and were found there by a person using the product.
    #
    # Once per change since 14.09.2026, not twice: the run on `main` that used
    # to gate the deployment is gone, because branch protection makes the tree
    # on `main` the tree tested here (SPEC §8). A pull request that changes none
    # of the paths in `changes` skips it, and `ci-ok` accepts the skip.
    #
    # The gate has to carry the build verdict for the same commit, not just the
    # browser one: `check` must have passed. `always()` because `changes` is
    # itself skipped on a manual run, which would otherwise skip this too.
    needs: [check, changes]
    if: >-
      always() && needs.check.result == 'success' &&
      (inputs.full || needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    # Two cold `next dev` boots, a browser install and up to two attempts per
    # database spec do not fit 30 minutes on a bad run.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/chromium
      # Migrations first: the journey signs an account up against these
      # relations, so they must exist before the web server takes a request.
      - name: Apply committed migrations to a fresh PostgreSQL 17 (G6)
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      - name: Fail-closed behaviour, against a server with no database
        run: pnpm test:e2e --project=chromium
      - name: The #20 journey and the reset round trip, against the database
        run: pnpm test:e2e --project=chromium-db
        env:
          # What playwright.config.ts hands the web server as DATABASE_URL.
          # The throwaway service container; it dies with the job.
          DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/platform_test_ci
      # The log is the server's whole stdout, and the dev e-mail transport
      # prints every message body — verification and reset links included. The
      # database behind those links is a throwaway container today, but the
      # artifact outlives the job by a week and the same accounts exist on dev
      # and in every preview's copy of it (#113), so the links never leave the
      # runner intact.
      - name: Redact action links from the server log
        if: failure()
        run: |
          if [ -f test-results/dev-server.log ]; then
            sed -i -E 's#https?://[^ ]*(token=|reset-password/)[^ ]*#<redacted>#g' test-results/dev-server.log
          fi
      # test-results/ carries the traces and the web server's own log — with
      # the github reporter there is no HTML report unless a run switches to
      # it, and the server log is the only copy of its output.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ github.job }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # The one required status check. Every job above that must not fail is
  # needed here; `preview` is not — a preview exists to be looked at, and it
  # failing to start is no verdict on the change.
  #
  # `always()`, because a job whose needs failed is itself skipped, and a
  # skipped required check counts as passed: without it, a red `check` would
  # skip this job and let the pull request merge. `skipped` is accepted from
  # the needed jobs — e2e-full on a docs change, `changes` on a manual run —
  # while `cancelled` is not.
  ci-ok:
    if: always()
    needs: [check, changes, image, deploy-config, e2e-smoke, e2e-full]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every needed job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          if jq -e 'all(.[]; . == "success" or . == "skipped")' <<<"$RESULTS" > /dev/null; then
            exit 0
          fi
          echo "::error::A job this pull request needs did not pass."
          exit 1

  preview:
    # #31: a pull request gets its own running copy, at its own hostname, so a
    # change can be looked at before it is merged — on request since
    # 14.09.2026: only while it carries the `preview` label (SPEC §8).
    #
    # Only for branches in THIS repository — a fork's pull request has no
    # access to the deploy key, and giving it one would hand the instance to
    # anyone who can open a PR. A manual run has no pull request, so no label.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview')
    # The gate and a serving image, same bar as dev. Not e2e-smoke: a preview
    # exists to be looked at, and a browser test failing is often the reason
    # you want to look. `deploy-config` IS required — it validates the proxy
    # configuration that previews are now part of.
    needs: [check, image, deploy-config]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      # #111: to ask whether the pull request is still open. Read only.
      pull-requests: read
    steps:
      - name: Is the instance wired up yet?
        id: wired
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No DEV_SSH_HOST secret yet — no instance to preview on."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      # #111: a preview that comes up after its pull request has closed stays
      # until someone removes it by hand — the cleanup (preview-cleanup.yml) ran
      # on `closed`, before there was anything to remove — and two of those
      # block every later preview at the cap. Found on 09.09.2026: `pr-77` up for
      # eight hours after its merge. The same holds for a label removed while a
      # run that saw it is still starting (14.09.2026): preview-down below runs
      # on `unlabeled`, before there is anything to remove.
      #
      # A failed read counts as open and labelled: previews then behave as they
      # did before this check, rather than stopping because the API hiccuped.
      - name: Is the pull request still open, and still asking for a preview?
        id: open
        if: steps.wired.outputs.wired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq 'if .state == "closed" then "closed" elif ([.labels[].name] | index("preview")) then "open" else "unlabelled" end') ||
            state=unknown
          if [ "$state" = closed ] || [ "$state" = unlabelled ]; then
            echo "::notice::Pull request #$PR is $state — no preview for it (#111)."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
      - name: Authorize this run against the instance
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ship the preview scripts
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          # ONLY the preview scripts. Not the Caddyfile and not compose.yaml:
          # those describe DEV, and copying a pull request's version of them
          # would let an unmerged change reconfigure the environment it is
          # supposed to be previewed alongside. They reach the instance from
          # `main`, through deploy-dev.
          scp -i ~/.ssh/id_deploy             deploy/preview-up.sh deploy/preview-down.sh             "$HOST:/opt/platform-lite/"
      - name: Start the preview
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          PR: ${{ github.event.pull_request.number }}
          # By tree, as dev deploys it.
          APP_IMAGE: ${{ needs.image.outputs.name }}:tree-${{ needs.image.outputs.tree }}
        run: |
          # NOT `ssh ... | tee`: a pipeline reports the exit status of its LAST
          # command, and tee always succeeds. This job's first run passed green
          # while the remote script had failed and started nothing at all.
          if ssh -i ~/.ssh/id_deploy "$HOST" "PR='$PR' APP_IMAGE='$APP_IMAGE' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' bash /opt/platform-lite/preview-up.sh" > preview.log 2>&1; then
            cat preview.log
            echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
            tail -1 preview.log >> "$GITHUB_STEP_SUMMARY"
          else
            cat preview.log
            exit 1
          fi
      # The other half of the race. Closed — or unlabelled — while the preview
      # was starting, the pull request has had its cleanup already, before
      # there was anything to remove, so nothing else will ever take this
      # preview down. Looked at again once it is up; a change after this line
      # is safe, because the cleanup then runs after the preview exists. Not
      # skipped when the start failed, nor when the run was cancelled or timed
      # out mid-start: by the health wait at the end of preview-up.sh the
      # container is already running, its trap does not remove it, and a
      # half-started preview nobody asked for is the same orphan (review).
      # preview-down.sh is safe to run for anything; a run cancelled by a newer
      # push reads `open` here and does nothing.
      - name: Take the preview down if the pull request closed or lost its label meanwhile
        if: >-
          always() &&
          steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq 'if .state == "closed" then "closed" elif ([.labels[].name] | index("preview")) then "open" else "unlabelled" end') ||
            state=unknown
          if [ "$state" = closed ] || [ "$state" = unlabelled ]; then
            echo "::notice::Pull request #$PR became $state while its preview was starting — removing it (#111)."
            ssh -i ~/.ssh/id_deploy "$HOST" "PR='$PR' bash /opt/platform-lite/preview-down.sh"
          elif [ "$state" = unknown ]; then
            # Not a failure — the preview is up and may well be wanted — but this
            # is the one read a missed orphan would hide behind, so say it (review).
            echo "::warning::Could not read whether pull request #$PR is still open and labelled (#111). If not, remove its preview by hand: PR=$PR bash /opt/platform-lite/preview-down.sh"
          fi

  # Removing the label takes the preview down; closing the pull request is
  # preview-cleanup.yml, as before. Not needed by `ci-ok`, like `preview`.
  preview-down:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action == 'unlabeled' && github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Is the instance wired up yet?
        id: wired
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No DEV_SSH_HOST secret yet — nothing to clean up."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authorize this run against the instance
        if: steps.wired.outputs.wired == 'true'
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Remove the preview
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # The script on the instance, as preview-cleanup.yml does: the
          # branch's copy is the pull request's own, and removing its preview
          # must not depend on what the branch changed. Idempotent.
          ssh -i ~/.ssh/id_deploy "$HOST" \
            "PR='$PR' bash /opt/platform-lite/preview-down.sh"
