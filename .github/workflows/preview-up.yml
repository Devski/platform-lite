name: Preview up

# Starts a pull request's preview (#31) on the dev instance. Called, never run
# on its own: by ci.yml for a push to a pull request that carries the `preview`
# label, and by preview.yml when the label is added. The caller is a
# pull_request run, so `github` here is that pull request's context.
#
# The image is the one ci.yml's `image` job built from this run's merge commit,
# found by the hash of its tree — the same tag a merge to `main` deploys.

on:
  workflow_call:
    inputs:
      wait-for-ci:
        description: >-
          Wait for ci.yml's check, deploy-config and image on the pull request's
          head commit to pass before starting (the label was added while they
          may still be running). ci.yml itself passes false: it already waited,
          through `needs`.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    # The wait, when there is one, is bounded by ci.yml's own image job.
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
      # #111: to ask whether the pull request is still open, and — since the
      # label (14.09.2026) — still asking for a preview. Read only.
      pull-requests: read
      checks: read
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Is the instance wired up yet?
        id: wired
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No DEV_SSH_HOST secret yet — no instance to preview on."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      # #111: a preview that comes up after its pull request has closed stays
      # until someone removes it by hand — the cleanup (preview.yml) ran on
      # `closed`, before there was anything to remove — and two of those block
      # every later preview at the cap. Found on 09.09.2026: `pr-77` up for
      # eight hours after its merge. The same holds for a label removed while a
      # run that saw it is still starting (14.09.2026).
      #
      # A failed read counts as open and labelled: previews then behave as they
      # did before this check, rather than stopping because the API hiccuped.
      - name: Is the pull request still open, and still asking for a preview?
        id: open
        if: steps.wired.outputs.wired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq 'if .state == "closed" then "closed" elif ([.labels[].name] | index("preview")) then "open" else "unlabelled" end') ||
            state=unknown
          if [ "$state" = closed ] || [ "$state" = unlabelled ]; then
            echo "::notice::Pull request #$PR is $state — no preview for it (#111)."
            echo "open=false" >> "$GITHUB_OUTPUT"
          else
            echo "open=true" >> "$GITHUB_OUTPUT"
          fi
      # The same bar ci.yml's `needs` sets: the gate, the proxy configuration
      # and a serving image, all on this head commit. The latest run of each
      # counts, so a re-run that passed is enough.
      - name: Wait for the pull request's checks
        if: inputs.wait-for-ci && steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 110); do
            # One line per required job: "<name> <status> <conclusion>".
            runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD/check-runs?filter=latest&per_page=100" \
              --jq '.check_runs[] | select(.app.slug == "github-actions") | select(.name == "check" or .name == "deploy-config" or .name == "image") | "\(.name) \(.status) \(.conclusion)"') ||
              runs=""
            if grep -qE ' completed (failure|cancelled|timed_out|action_required|startup_failure|stale)$' <<<"$runs"; then
              echo "$runs"
              echo "::error::A check this preview needs did not pass on $HEAD — fix it and push; the label stays."
              exit 1
            fi
            if [ "$(grep -cE '^(check|deploy-config|image) completed success$' <<<"$runs")" = 3 ]; then
              echo "$runs"
              exit 0
            fi
            sleep 20
          done
          echo "::error::The checks on $HEAD did not finish in time."
          exit 1
      - uses: actions/checkout@v7
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
      - name: Resolve the image
        id: image
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]'):tree-$(git rev-parse 'HEAD^{tree}')"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # A label added after `main` moved: this run's merge commit is not the
          # one ci.yml built, so its tree has no image. Said plainly rather
          # than left to a pull that fails on the instance.
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          if ! docker buildx imagetools inspect "$image" > /dev/null 2>&1; then
            echo "::error::No image for this merge yet ($image): main has moved since the pull request's CI ran. Rebase on main and push; the label starts the preview on that run."
            exit 1
          fi
      - name: Authorize this run against the instance
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ship the preview scripts
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          # ONLY the preview scripts. Not the Caddyfile and not compose.yaml:
          # those describe DEV, and copying a pull request's version of them
          # would let an unmerged change reconfigure the environment it is
          # supposed to be previewed alongside. They reach the instance from
          # `main`, through deploy-dev.
          scp -i ~/.ssh/id_deploy             deploy/preview-up.sh deploy/preview-down.sh             "$HOST:/opt/platform-lite/"
      - name: Start the preview
        if: steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          APP_IMAGE: ${{ steps.image.outputs.image }}
        run: |
          # NOT `ssh ... | tee`: a pipeline reports the exit status of its LAST
          # command, and tee always succeeds. This job's first run passed green
          # while the remote script had failed and started nothing at all.
          if ssh -i ~/.ssh/id_deploy "$HOST" "PR='$PR' APP_IMAGE='$APP_IMAGE' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' bash /opt/platform-lite/preview-up.sh" > preview.log 2>&1; then
            cat preview.log
            echo "### Preview" >> "$GITHUB_STEP_SUMMARY"
            tail -1 preview.log >> "$GITHUB_STEP_SUMMARY"
          else
            cat preview.log
            exit 1
          fi
      # The other half of the race. Closed — or unlabelled — while the preview
      # was starting, the pull request has had its cleanup already, before
      # there was anything to remove, so nothing else will ever take this
      # preview down. Looked at again once it is up; a change after this line
      # is safe, because the cleanup then runs after the preview exists. Not
      # skipped when the start failed, nor when the run was cancelled or timed
      # out mid-start: by the health wait at the end of preview-up.sh the
      # container is already running, its trap does not remove it, and a
      # half-started preview nobody asked for is the same orphan (review).
      # preview-down.sh is safe to run for anything; a run cancelled by a newer
      # push reads `open` here and does nothing.
      - name: Take the preview down if the pull request closed or lost its label meanwhile
        if: >-
          always() &&
          steps.wired.outputs.wired == 'true' && steps.open.outputs.open == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" \
            --jq 'if .state == "closed" then "closed" elif ([.labels[].name] | index("preview")) then "open" else "unlabelled" end') ||
            state=unknown
          if [ "$state" = closed ] || [ "$state" = unlabelled ]; then
            echo "::notice::Pull request #$PR became $state while its preview was starting — removing it (#111)."
            ssh -i ~/.ssh/id_deploy "$HOST" "PR='$PR' bash /opt/platform-lite/preview-down.sh"
          elif [ "$state" = unknown ]; then
            # Not a failure — the preview is up and may well be wanted — but this
            # is the one read a missed orphan would hide behind, so say it (review).
            echo "::warning::Could not read whether pull request #$PR is still open and labelled (#111). If not, remove its preview by hand: PR=$PR bash /opt/platform-lite/preview-down.sh"
          fi
