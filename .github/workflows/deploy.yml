name: Deploy

# Pull requests test, `main` deploys (decision of 14.09.2026, SPEC §8). Nothing
# here tests or builds an image: it deploys the one pr.yml built and checked
# for the tree that landed.
#
# Branch protection is the guarantee, not a `needs:`. `ci-ok` is required,
# admins included; branches must be up to date before merging; merges are
# squashed. So the tree of a commit on `main` is a tree pr.yml tested on
# refs/pull/N/merge (the full argument sits above pr.yml's `image` job). The
# image is taken only if its signature proves pr.yml built it from that tree
# (.github/actions/verified-image). A tree with no such image never went
# through a pull request, and is refused rather than built: building it here
# would deploy code no test has seen.

on:
  push:
    branches: [main]
    # SPEC §8 deploys prod manually, from an approval gate or a vX.Y.Z tag.
    tags: ["v*.*.*"]

permissions:
  contents: read

# Never cancelled: every push is a deployment or a release. One at a time per
# ref; a push still waiting is replaced by a newer one, which carries its
# change too.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # SPEC §8: dev deploys automatically from `main`.
  #
  # Until the instance side of #21 is wired — secrets, open ports, the
  # /opt/platform-lite directory — this reports itself skipped rather than
  # failing every push. A red gate everyone learns to ignore is worse than no
  # gate at all.
  deploy-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # To add `:<sha>` and `:main` to the image; handed to the instance for
      # the length of this run so it can pull.
      packages: write
      # To read the image's signature.
      attestations: read
    steps:
      - uses: actions/checkout@v7
      - name: Find the image this tree's pull request checked, and prove it
        id: image
        uses: ./.github/actions/verified-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the verified image for this commit
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          # From the digest that was verified, not from the tree tag, which
          # anyone publishing can move. The commit's own tag is what dev pulls:
          # no pull request run can have published it ahead of time, since the
          # squash commit's SHA does not exist until the merge.
          docker buildx imagetools create --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:main" "$IMAGE@$DIGEST"
      - name: Is the instance wired up yet?
        id: wired
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::No DEV_SSH_HOST secret yet — nothing to deploy to. See docs/deployment.md."
            echo "wired=false" >> "$GITHUB_OUTPUT"
          else
            echo "wired=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Authorize this run against the instance
        if: steps.wired.outputs.wired == 'true'
        env:
          KEY: ${{ secrets.DEV_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned, never StrictHostKeyChecking=no: a deploy that trusts
          # whatever answers at that address is a deploy anyone on the path
          # can take over.
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Ship the deployment files
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
        run: |
          scp -i ~/.ssh/id_deploy \
            deploy/compose.yaml deploy/Caddyfile deploy/remote-deploy.sh \
            deploy/backup-db.sh deploy/ops-check.sh \
            "$HOST:/opt/platform-lite/"
      - name: Pull the image and restart the container
        if: steps.wired.outputs.wired == 'true'
        env:
          HOST: ${{ secrets.DEV_SSH_HOST }}
          # Short-lived and scoped to this run. The instance is granted a pull
          # for the length of the deployment and keeps no standing registry
          # credential of its own (G9).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          # The commit SHA is what a deployment pins, so rolling back is
          # re-running this against an older one (SPEC §8).
          APP_IMAGE: ${{ steps.image.outputs.image }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy "$HOST" \
            "APP_IMAGE='$APP_IMAGE' GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' \
             bash /opt/platform-lite/remote-deploy.sh"

  # A vX.Y.Z tag names a release: the same verified image, one more tag.
  # Production deploys from it by hand (SPEC §8) — nothing here reaches an
  # instance.
  release-tag:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@v7
      - name: Find the image this tree's pull request checked, and prove it
        id: image
        uses: ./.github/actions/verified-image
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the verified image with the version
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:$GITHUB_REF_NAME" "$IMAGE@$DIGEST"

  # Caches are scoped: a pull request restores what its own earlier runs
  # saved, or what `main` saved — never another pull request's. `main` no
  # longer installs or builds anything, so after a dependency change every
  # new pull request would start cold, for good. This refills `main`'s copy,
  # by itself and only when the push changed what the caches are keyed on:
  # the lockfile and workspace file (the pnpm store, the Docker dependency
  # layer), package.json (the Playwright version) or the Dockerfile.
  #
  # Beside the deployment, never in front of it: a cache that failed to fill
  # costs the next pull request a minute, not dev its update.
  cache-warm:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # a squash merge is one commit: HEAD^ is main before it
      - name: Did this push change what the caches are keyed on?
        id: keys
        run: |
          # A diff that cannot be read (no parent) counts as a change.
          if git diff --quiet HEAD^ HEAD -- pnpm-lock.yaml pnpm-workspace.yaml package.json Dockerfile 2> /dev/null; then
            echo "::notice::No dependency change — the caches main holds still fit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v6
        if: steps.keys.outputs.changed == 'true'
      - uses: actions/setup-node@v7
        if: steps.keys.outputs.changed == 'true'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.keys.outputs.changed == 'true'
      - uses: ./.github/actions/chromium
        if: steps.keys.outputs.changed == 'true'
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        if: steps.keys.outputs.changed == 'true'
      - name: Build the image into the cache only
        if: steps.keys.outputs.changed == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          outputs: type=cacheonly
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
